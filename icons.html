<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iconos e Imágenes Alineadas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white m-0">

    <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-black">
        
        <!-- Contenedor principal  -->
        <div class="p-5 rounded bg-black w-100">
            
            <div class="d-flex justify-content-center align-items-center gap-4 mb-4">
                <img src="./IMAGE/iconos/hollow.webp" alt="Imagen 1" class="rounded-circle border border-2 border-white shadow" style="width: 120px; height: 120px; object-fit: cover;">
                <img src="./IMAGE/iconos/link.jpg" alt="Imagen 2" class="rounded-circle border border-2 border-white shadow" style="width: 120px; height: 120px; object-fit: cover;">
                <img src="./IMAGE/iconos/cuphead.png" alt="Imagen 3" class="rounded-circle border border-2 border-white shadow" style="width: 120px; height: 120px; object-fit: cover;">
                <img src="./IMAGE/iconos/ada.jpg" alt="Imagen 4" class="rounded-circle border border-2 border-white shadow" style="width: 120px; height: 120px; object-fit: cover;">
            </div>

            <div class="d-flex justify-content-center align-items-center gap-4 mb-4">
                <img src="./IMAGE/iconos/papa.jpg" alt="Imagen 5" class="rounded-circle border border-2 border-white shadow" style="width: 120px; height: 120px; object-fit: cover;">
                <img src="./IMAGE/iconos/halo.jpg" alt="Imagen 6" class="rounded-circle border border-2 border-white shadow" style="width: 120px; height: 120px; object-fit: cover;">
                <img src="./IMAGE/iconos/cj.jpg" alt="Imagen 7" class="rounded-circle border border-2 border-white shadow" style="width: 120px; height: 120px; object-fit: cover;">
                <img src="./IMAGE/iconos/jinx.webp" alt="Imagen 8" class="rounded-circle border border-2 border-white shadow" style="width: 120px; height: 120px; object-fit: cover;">
            </div>

            <div class="d-flex justify-content-center align-items-center gap-4">
                <div class="rounded-circle text-white d-flex justify-content-center align-items-center fs-1 shadow" style="width: 120px; height: 120px; background-color: #6f42c1;">💀</div>
                <div class="rounded-circle text-white d-flex justify-content-center align-items-center fs-1 shadow" style="width: 120px; height: 120px; background-color: #198754;">🤖</div>
                <div class="rounded-circle text-white d-flex justify-content-center align-items-center fs-1 shadow" style="width: 120px; height: 120px; background-color: #20c997;">👾</div>
                <div class="rounded-circle text-white d-flex justify-content-center align-items-center fs-1 shadow" style="width: 120px; height: 120px; background-color: #dc3545;">⛔</div>
                <div class="rounded-circle text-white d-flex justify-content-center align-items-center fs-1 shadow" style="width: 120px; height: 120px; background-color: #fd7e14;">😎</div>
            </div>

        </div>
    </div>

</body>
</html>
