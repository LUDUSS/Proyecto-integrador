<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juegos | LUDUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/inicio.css">
  <link rel="stylesheet" href="./css/paletas.css">
  <link rel="stylesheet" href="./css/juegos.css">
  <script src="./JS/auth.js"></script>
  <script>
    if (!requireAuth()) document.documentElement.style.visibility = "hidden";
  </script>
</head>
<body>
  <header id="navbar"></header>
  <main class="container py-4 py-lg-5">
    <section class="games-heading mb-4">
      <div>
        <p class="text-uppercase small fw-semibold text-primary mb-2">Explora LUDUS</p>
        <h1 class="display-5 fw-bold mb-2">Juegos</h1>
        <p class="text-body-secondary mb-0">Encuentra un juego y descubre lo que opina la comunidad.</p>
      </div>
    </section>

    <section id="game-browser" aria-labelledby="game-browser-title">
      <div class="d-flex flex-column flex-md-row align-items-md-end justify-content-between gap-3 mb-4">
        <div>
          <h2 id="game-browser-title" class="h3 fw-bold mb-1">Catálogo</h2>
          <p id="game-count" class="text-body-secondary mb-0" aria-live="polite"></p>
        </div>
        <div class="game-search">
          <label for="game-search" class="visually-hidden">Buscar juego</label>
          <i class="bi bi-search" aria-hidden="true"></i>
          <input id="game-search" class="form-control" type="search" placeholder="Buscar por nombre, categoría o plataforma">
        </div>
      </div>
      <div id="game-list" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4"></div>
      <div id="game-empty" class="empty-state d-none">
        <i class="bi bi-controller" aria-hidden="true"></i>
        <h3 class="h5">Aún no hay juegos en el catálogo</h3>
        <p class="text-body-secondary mb-0">Los juegos disponibles aparecerán aquí.</p>
      </div>
      <div id="game-no-results" class="empty-state d-none">
        <i class="bi bi-search" aria-hidden="true"></i>
        <h3 class="h5">No encontramos ese juego</h3>
        <p class="text-body-secondary mb-0">Prueba con otro nombre, categoría o plataforma.</p>
      </div>
    </section>

    <section id="game-detail" class="d-none" aria-live="polite"></section>
  </main>
  <section id="footer"></section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./JS/header.js"></script>
  <script src="./JS/footer.js"></script>
  <script src="./JS/api.js"></script>
  <script src="./JS/navbar.js"></script>
  <script src="./JS/theme.js"></script>
  <script src="./JS/paletas.js"></script>
  <script src="./JS/catalogoJuegos.js"></script>
</body>
</html>
