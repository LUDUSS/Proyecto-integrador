<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | LUDUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/inicio.css">
</head>
<body class="bg-body-tertiary">
  <header id="navbar"></header>
  <main class="container py-5" style="max-width: 520px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 fw-bold mb-2">Iniciar sesión</h1>
        <p class="text-body-secondary mb-4">Accede a tu perfil de LUDUS.</p>
        <div id="form-message" class="alert d-none" role="alert"></div>
        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
        </form>
        <p class="mt-4 mb-0 text-center">¿No tienes cuenta? <a href="./registro.html">Crear cuenta</a></p>
        <p class="small text-body-secondary mt-4 mb-0">Demo académica: las cuentas se guardan solo en este navegador.</p>
      </div>
    </div>
  </main>
  <script src="./JS/auth.js"></script>
  <script src="./JS/navbar.js"></script>
  <script src="./JS/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const loginForm = document.getElementById("login-form");
    const message = document.getElementById("form-message");

    if (new URLSearchParams(window.location.search).get("required") === "1") {
      message.textContent = "Debes iniciar sesión para acceder a esa sección.";
      message.className = "alert alert-warning";
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      message.className = "alert d-none";

      try {
        loginUser({
          email: loginForm.email.value,
          password: loginForm.password.value
        });
        window.location.href = getPostLoginDestination();
      } catch (error) {
        message.textContent = error.message;
        message.className = "alert alert-danger";
      }
    });
  </script>
</body>
</html>
