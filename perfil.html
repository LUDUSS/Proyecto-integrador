<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/inicio.css">
    <link rel="stylesheet" href="./css/acercade.css">
    <link rel="stylesheet" href="./css/Perfil.css">
</head>

<body>

    <!-- Barra de navegación -->
    <header id="navbar"></header>

    <!-- Contenido principal -->
    <main class="perfil-layout container-fluid">

        <!-- Menú lateral -->
        <aside class="perfil-sidebar card">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="#">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Reseñas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="#">Perfil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Configuración</a>
                </li>
            </ul>
        </aside>

        <!-- Contenido de videojuegos -->
        <section class="perfil-content">

            <!-- Tarjeta del videojuego -->
            <article class="card tarjeta-juego">

                <div class="row g-0 tarjeta-juego__fila">

                    <!-- Imagen a la izquierda -->
                    <div class="col-md-4 tarjeta-juego__imagen">
                        <img
                            src="./IMAGE/juegos/baldurs.jpg"
                            alt="Baldur's Gate 3">
                    </div>

                    <!-- Descripción y calificación a la derecha -->
                    <div class="col-md-8 tarjeta-juego__contenido">

                        <div class="card-body tarjeta-juego__cuerpo">

                            <!-- Descripción -->
                            <div class="tarjeta-juego__descripcion">
                                <h5 class="card-title">
                                    Baldur's Gate 3
                                </h5>

                                <p class="card-text">
                                    Descubre este videojuego de rol y fantasía,
                                    toma decisiones que cambiarán tu aventura
                                    y comparte tu experiencia con otros jugadores.
                                </p>

                                <p class="card-text">
                                    <small class="text-body-secondary">
                                        Comparte tu opinión sobre este juego.
                                    </small>
                                </p>
                            </div>

                            <!-- Calificación debajo de la descripción -->
                            <div class="tarjeta-juego__calificacion">

                                <h6 class="card-title">
                                    Califica tu experiencia
                                </h6>

                                <p class="card-text">
                                    ¿Qué te pareció este videojuego?
                                </p>

                                <div class="wrap">
                                    <div class="stars">

                                        <label class="rate">
                                            <input type="radio" name="radio1"
                                                id="star1" value="star1">
                                            <div class="face"></div>
                                            <i class="far fa-star star one-star"></i>
                                        </label>

                                        <label class="rate">
                                            <input type="radio" name="radio1"
                                                id="star2" value="star2">
                                            <div class="face"></div>
                                            <i class="far fa-star star two-star"></i>
                                        </label>

                                        <label class="rate">
                                            <input type="radio" name="radio1"
                                                id="star3" value="star3">
                                            <div class="face"></div>
                                            <i class="far fa-star star three-star"></i>
                                        </label>

                                        <label class="rate">
                                            <input type="radio" name="radio1"
                                                id="star4" value="star4">
                                            <div class="face"></div>
                                            <i class="far fa-star star four-star"></i>
                                        </label>

                                        <label class="rate">
                                            <input type="radio" name="radio1"
                                                id="star5" value="star5">
                                            <div class="face"></div>
                                            <i class="far fa-star star five-star"></i>
                                        </label>

                                    </div>
                                </div>

                            </div>

                        </div>
                    </div>

                </div>
            </article>

        </section>

    </main>

    <!-- Footer -->
    <footer id="footer"></footer>

    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Scripts personalizados -->
    <script src="./JS/header.js"></script>
    <script src="./JS/theme.js"></script>
    <script src="./JS/footer.js"></script>
    <script src="./JS/navbar.js"></script>
    <script src="./JS/Perfil.js"></script>

</body>
</html>
