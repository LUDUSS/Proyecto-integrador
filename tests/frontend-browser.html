<!doctype html><meta charset="utf-8"><title>Frontend integration checks</title><pre id="output">RUNNING</pre><iframe id="app" width="390" height="844"></iframe>
<script>
(async()=>{
 const output=document.getElementById('output'), frame=document.getElementById('app'), results=[];
 const wait=ms=>new Promise(r=>setTimeout(r,ms));

 input(w,'#game-search','abc');input(w,'#game-search','abcd');input(w,'#game-search','vacio');await until(()=>w.document.querySelector('#game-list').children.length===0&&w.document.body.textContent.includes('No encontramos juegos con estos criterios.'));assert(w.__calls.filter(c=>c.path.includes('/buscar')).length===1,'debounced search and empty state');assert(w.__calls.find(c=>c.path.includes('/buscar')).query.includes('sort=relevancia'),'search sort');

 w.__hold=(path,q)=>path.endsWith('/buscar')&&q.get('nombre')==='old';
 input(w,'#game-search','old');await until(()=>w.__held.length===1);
 input(w,'#game-search','vacio');assert([...w.document.querySelectorAll('button')].find(b=>b.textContent==='Cargar más').disabled,'pagination disabled during debounce');
 w.__held.shift().resolve();await wait(30);assert(!w.document.querySelector('#game-list a'),'stale catalog response discarded immediately after input');
 await until(()=>w.document.body.textContent.includes('No encontramos juegos con estos criterios.'));w.__hold=null;
 w=await open('/juegos.html?igdbId=42');await until(()=>w.document.querySelector('#game-detail form'));
 assert(w.document.body.textContent.includes('Opinion de otro <img'),'reviews from other users displayed safely');assert(![...w.document.querySelectorAll('button')].some(b=>b.textContent==='Editar'),'other user cannot edit');
 assert(!w.__calls.some(c=>c.method==='POST'),'opening detail never creates game');
 let callbackEvent;const helper=w.eval('Ludus').button('Evento',event=>callbackEvent=event);w.document.body.append(helper);helper.click();assert(callbackEvent?.currentTarget===null&&callbackEvent?.target===helper,'button callback receives native event');helper.remove();
 const precision=w.document.querySelector('input[type=number]');precision.value='4.25';assert(precision.checkValidity(),'review accepts backend decimal precision');
 click(w,'Escribe una reseña');assert(w.document.getElementById('game-review-modal').classList.contains('show'),'game create action opens modal');click(w,'Cancelar');assert(!w.document.getElementById('game-review-modal').classList.contains('show'),'game modal cancel closes without writing');click(w,'Escribe una reseña');
 let form=w.document.querySelector('#game-detail form');input(w,'textarea','Mi opinion');form.dispatchEvent(new w.Event('submit',{cancelable:true}));form.dispatchEvent(new w.Event('submit',{cancelable:true}));await until(()=>w.document.body.textContent.includes('Editar reseña'));assert(w.__calls.filter(c=>c.method==='POST').length===1,'create 201 and double submit prevented');assert(w.__calls.find(c=>c.method==='POST').body.idUsuario===undefined,'author exclusively identified by JWT');
 click(w,'Editar');assert(w.document.getElementById('game-review-modal').classList.contains('show'),'own game review edit opens modal');
 form=w.document.querySelector('#game-detail form');input(w,'textarea','Opinion editada');form.dispatchEvent(new w.Event('submit',{cancelable:true}));await until(()=>w.__calls.some(c=>c.method==='PUT'));await until(()=>w.document.body.textContent.includes('Opinion editada'));assert(true,'update review and refresh');
 w.__forbidden=true;form=w.document.querySelector('#game-detail form');form.dispatchEvent(new w.Event('submit',{cancelable:true}));await until(()=>w.document.body.textContent.includes('No tienes permiso'));assert(true,'403 preserved and shown');w.__forbidden=false;
 w.__conflict=true;form.dispatchEvent(new w.Event('submit',{cancelable:true}));await until(()=>form.textContent.includes('Conflicto de integridad'));assert(!form.textContent.includes('Ya tienes una reseña'),'PUT integrity conflict is not presented as duplicate POST');
 click(w,'Eliminar');await until(()=>w.__alert?.includes('Conflicto de integridad'));assert(w.__alert.startsWith('No se pudo eliminar')&&![...w.document.querySelectorAll('button')].find(b=>b.textContent==='Eliminar').disabled,'DELETE integrity conflict preserves review and unlocks button');w.__conflict=false;
 const priorDeletes=w.__calls.filter(c=>c.method==='DELETE').length;w.__hold=(path,q,method)=>method==='DELETE';const deleteButton=[...w.document.querySelectorAll('button')].find(b=>b.textContent==='Eliminar');const child=w.document.createElement('span');child.textContent=' icono';deleteButton.append(child);child.click();await until(()=>w.__held.length===1);assert(deleteButton.disabled,'delete captures currentTarget before awaiting');deleteButton.click();assert(w.__calls.filter(c=>c.method==='DELETE').length===priorDeletes+1,'delete prevents double click');w.__hold=null;w.__held.shift().resolve();await until(()=>w.document.body.textContent.includes('Escribe una reseña'));assert(w.__calls.some(c=>c.method==='DELETE'),'delete 204 and refresh');assert(w.__errors.length===0,'delete has no unhandled event errors');
 w.__duplicate=true;form=w.document.querySelector('#game-detail form');input(w,'textarea','Duplicada');form.dispatchEvent(new w.Event('submit',{cancelable:true}));await until(()=>w.document.body.textContent.includes('Ya tienes una reseña'));assert(true,'duplicate 409 explained and refreshed');
 const visual={alias:'',description:'',aboutIcon:'bi-trophy','lines-color':'#39ff14',avatar:'./IMAGE/perfil/avatar-1.png',cover:'',avatarPosition:{x:50,y:50},coverPosition:{x:50,y:50}};
 localStorage.setItem('ludus_visual_profile:7',JSON.stringify(visual));localStorage.setItem('perfil-usuario',JSON.stringify({...visual,'lines-color':'#ff1744'}));
 w=await open('/perfil.html?paging=1');await until(()=>w.document.getElementById('perfil-alias').textContent==='Jugador API');assert(w.document.getElementById('perfil-descripcion').textContent==='Biografia API','own profile API fields');
 assert(w.document.querySelector('.perfil-content').style.getPropertyValue('--lines-color')==='#39ff14','owner retains scoped visual preferences');assert(w.document.getElementById('perfil-juegos-resenados').textContent==='1','game statistics use juegosResenados rather than review count');
 const shortCard=w.document.querySelector('.ludus-review');assert(shortCard.getBoundingClientRect().height<300,'short profile review stays compact');assert(shortCard.querySelector('button').getBoundingClientRect().width<140,'review action is compact rather than stretched');
 const longText='Una aventura extraordinaria. '.repeat(70)+'PalabraSinEspacios'.repeat(30);
 const longCard=w.eval('Ludus').reviewCard({idResenia:99,texto:longText,calificacion:4.25,fechaPublicacion:'2026-11-05T12:30:00',autor:{idUsuario:7,nombre:'Autor'},juego:{igdbId:42,nombre:'Un título muy largo para comprobar el ajuste en pantallas pequeñas'}},7,()=>{},async()=>{});
 w.document.getElementById('lista-resenias').append(longCard);click(w,'Ver más',longCard);assert(longCard.querySelector('.ludus-review__text').textContent===longText,'long review expands without truncating stored text');assert(w.document.documentElement.scrollWidth<=w.innerWidth+1,'profile long review has no mobile overflow');click(w,'Ver menos',longCard);assert(longCard.querySelector('.ludus-review__text').textContent.length===401,'long review collapses');longCard.remove();
 const profileForm=w.document.getElementById('formulario-editar-perfil');input(w,'#perfil-alias-input','Nuevo nombre');input(w,'#perfil-descripcion-input','Nueva bio');profileForm.dispatchEvent(new w.Event('submit',{cancelable:true}));await until(()=>w.document.getElementById('perfil-alias').textContent==='Nuevo nombre');assert(!profileForm.querySelector('[type=submit]').disabled,'profile PUT and submit unlock');
 assert(!w.document.getElementById('mostrar-formulario-resenia'),'profile has no creation entry point');click(w,'Editar');assert(w.document.getElementById('modal-resenia').classList.contains('show'),'profile edit opens modal');input(w,'#texto-resenia','Desde perfil');input(w,'#review-decimal','4.5');w.document.getElementById('formulario-resenia').dispatchEvent(new w.Event('submit',{cancelable:true}));await until(()=>w.document.getElementById('lista-resenias').textContent.includes('Desde perfil'));assert(w.__calls.filter(c=>c.method==='POST').length===0,'profile edits use PUT without publication');
 w=await open('/perfil.html?idUsuario=8');await until(()=>w.document.getElementById('perfil-alias').textContent==='Otro perfil');await until(()=>w.document.getElementById('lista-resenias').textContent.includes('Opinion de otro'));assert(w.document.getElementById('editar-perfil').hidden&&!w.document.getElementById('mostrar-formulario-resenia'),'foreign profile read only');assert(w.__calls.some(c=>c.path==='/ludus/publicacion/usuario/8'),'foreign reviews endpoint');
 assert(w.document.querySelector('.perfil-content').style.getPropertyValue('--lines-color')==='#8b8484fa'&&w.document.getElementById('perfil-avatar-imagen').hidden,'foreign profile never inherits local visuals');
 w=await open('/perfil.html?as=8');await until(()=>w.document.getElementById('perfil-alias').textContent==='Jugador API');assert(w.document.getElementById('perfil-avatar-imagen').hidden,'unscoped legacy visuals are not assigned to another owner');assert(localStorage.getItem('perfil-usuario')===JSON.stringify({...visual,'lines-color':'#ff1744'}),'legacy localStorage preserved unchanged');
 w=await open('/index.html');await until(()=>w.document.querySelector('#container-juegos-destacados a')&&w.document.querySelector('#recent-reviews article'));assert(true,'dynamic featured and latest reviews');
 assert(w.__errors.length===0,'no uncaught JS errors on home');
 w=await open('/juegos.html?id=1');await until(()=>w.document.querySelector('#game-detail form'));assert(w.__calls.some(c=>c.path==='/ludus/juego/1')&&w.__calls.some(c=>c.path==='/ludus/igdb/juegos/42'),'legacy local ID resolved separately');
 assert(!w.__calls.some(c=>c.path==='/ludus/igdb/juegos/1'),'legacy local ID never passed as external ID');
 w=await open('/juegos.html?id=2');await until(()=>w.document.querySelector('#game-detail h1'));assert(w.document.querySelector('#game-detail h1').textContent==='Historico local','IGDB 404 retains historical local detail');assert(!w.document.querySelector('#game-detail form')&&!w.__calls.some(c=>c.method!=='GET'),'unverified historical game never resolved or published');
 w=await open('/juegos.html?id=3');await until(()=>w.document.querySelector('#game-detail h1'));assert(w.document.querySelector('#game-detail h1').textContent==='Sin identidad externa'&&!w.__calls.some(c=>c.path.includes('/igdb/')),'local game without id_api remains readable');
 w=await open('/juegos.html?igdbId=42&paging=1');await until(()=>w.document.querySelector('#game-detail form'));
 w.__hold=(path,q,method)=>path==='/ludus/publicacion/juego/igdb/42'&&q.get('page')==='1';click(w,'Cargar más');await until(()=>w.__held.length===1);click(w,'Eliminar');await until(()=>w.document.body.textContent.includes('Escribe una reseña'));w.__hold=null;w.__held.shift().resolve();await wait(100);assert(!w.document.body.textContent.includes('Editar reseña')&&![...w.document.querySelectorAll('button')].some(b=>b.textContent==='Eliminar'),'detail refresh supersedes pending review page');assert(w.document.querySelectorAll('.game-review').length===1,'stale detail page cannot restore deleted review');
 w=await open('/perfil.html?paging=1');await until(()=>w.document.querySelector('#lista-resenias article'));w.__hold=(path,q)=>path==='/ludus/publicacion/me'&&q.get('page')==='1';click(w,'Cargar más');await until(()=>w.__held.length===1);click(w,'Eliminar');await until(()=>w.document.body.textContent.includes('Todavía no hay reseñas.'));w.__hold=null;w.__held.shift().resolve();await wait(100);assert(w.document.querySelectorAll('#lista-resenias article').length===0,'profile refresh supersedes pending review page');
 w=await open('/juegos.html');await until(()=>w.document.querySelector('#game-list a'));w.__fail=true;input(w,'#game-search','fallo');await until(()=>w.document.body.textContent.includes('Servicio temporalmente no disponible'));assert(true,'503 with retry');
 assert(w.__errors.length===0,'no uncaught JS errors on catalog');
 w.__fail=false;click(w,'Reintentar');await until(()=>w.document.querySelector('#game-list a'));assert(true,'retry recovers catalog');
 assert(w.__calls.every(c=>c.headers.Authorization==='Bearer fixture-token'),'protected requests carry LUDUS JWT');
 w=await open('/juegos.html?lookup=1');await until(()=>w.document.body.textContent.includes('No se pudieron cargar generos'));click(w,'Reintentar');await until(()=>w.document.querySelector('select').options.length===3);assert(new Set([...w.document.querySelector('select').options].map(o=>o.value)).size===3,'lookup retry preserves unique IDs across partial pages');
 assert(w.document.documentElement.scrollWidth<=w.innerWidth+1,'catalog has no horizontal overflow at 390px');
 frame.width=1280;await wait(100);assert(w.document.documentElement.scrollWidth<=w.innerWidth+1,'catalog has no horizontal overflow at 1280px');
 output.textContent=results.join('\n')+'\nALL PASSED';
 }catch(e){output.textContent=results.join('\n')+'\nFAIL '+e.stack+'\nURL '+frame.contentWindow.location.href+'\nERRORS '+JSON.stringify(frame.contentWindow.__errors)+'\nCALLS '+JSON.stringify(frame.contentWindow.__calls)+'\nBODY '+frame.contentDocument.body.textContent;}
})();
</script>
