<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | LUDUS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/inicio.css">
</head>
<body class="bg-body-tertiary">
  <header id="navbar"></header>
  <main class="container py-5" style="max-width: 560px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 fw-bold mb-2">Crear cuenta</h1>
        <p class="text-body-secondary mb-4">Regístrate para acceder a tu perfil.</p>
        <div id="form-message" class="alert d-none" role="alert"></div>
        <form id="register-form">
          <div class="mb-3">
            <label for="name" class="form-label">Nombre</label>
            <input id="name" name="name" type="text" class="form-control" autocomplete="name" minlength="2" maxlength="60" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
            <div class="form-text">Usa al menos 8 caracteres. No uses una contraseña real que utilices en otros sitios.</div>
          </div>
          <div class="mb-3">
            <label for="confirm-password" class="form-label">Confirmar contraseña</label>
            <input id="confirm-password" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
        </form>
        <p class="mt-4 mb-0 text-center">¿Ya tienes cuenta? <a href="./login.html">Iniciar sesión</a></p>
        <p class="small text-body-secondary mt-4 mb-0">Demo académica: los datos se guardan solo en este navegador y no se sincronizan.</p>
      </div>
    </div>
  </main>
  <script src="./JS/auth.js"></script>
  <script src="./JS/navbar.js"></script>
  <script src="./JS/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const registerForm = document.getElementById("register-form");
    const message = document.getElementById("form-message");

    registerForm.addEventListener("submit", (event) => {
      event.preventDefault();
      message.className = "alert d-none";

      const password = registerForm.password.value;
      const confirmPassword = registerForm.confirmPassword.value;

      if (password !== confirmPassword) {
        message.textContent = "Las contraseñas no coinciden.";
        message.className = "alert alert-danger";
        return;
      }

      try {
        registerUser({
          name: registerForm.name.value,
          email: registerForm.email.value,
          password
        });
        message.textContent = "Cuenta creada. Ahora inicia sesión con tu correo y contraseña.";
        message.className = "alert alert-success";
        registerForm.reset();
      } catch (error) {
        message.textContent = error.message;
        message.className = "alert alert-danger";
      }
    });
  </script>
</body>
</html>
