<!DOCTYPE html>

<head>

    <title>Reseñas de la comunidad</title>

    <!-- Bootstrap -->

            </button>
        </div>

        <!-- Menú lateral adaptado con Bootstrap Offcanvas (oculto en móviles, fijo de md en adelante) -->
        <aside id="menuLateral" class="perfil-sidebar card offcanvas-md offcanvas-start" tabindex="-1" aria-labelledby="menuLateralLabel">
            <div class="offcanvas-header d-md-none">
                <h5 class="offcanvas-title" id="menuLateralLabel">Menú</h5>

                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./perfil.html">Perfil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Configuración</a> 
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Contenido de reseñas -->
        <section class="perfil-content">

             <h1 class="h3 mb-4">Reseñas de la comunidad</h1>

            <!-- Aquí JavaScript insertará las tarjetas -->
            <div id="lista-resenas-comunidad" class="lista-resenias">
                <!-- Se llena desde reseniasComunidad.js -->
            </div> 

        </section>

    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

    <script src="./JS/footer.js"></script>
